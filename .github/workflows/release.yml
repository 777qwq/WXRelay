name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    # v2.4.2 绕障：macos runner 僵死频发，4 路并行抽签，先成功者发布（publish 步骤自幂等）

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install packaging tools
        run: |
          brew install bash dpkg ldid xz gnu-sed findutils coreutils file ripgrep
          BREW_PREFIX="$(brew --prefix)"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Cache roothide Theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: roothide-theos-${{ runner.os }}-v2-sdk165

      - name: Prepare roothide Theos
        run: |
          sudo mkdir -p /opt
          if [ ! -d /opt/theos ]; then
            sudo git clone --depth 1 --recursive https://github.com/roothide/theos.git /opt/theos
          else
            cd /opt/theos
            sudo git fetch --depth 1 origin master
            sudo git reset --hard FETCH_HEAD
            sudo git submodule update --init --recursive
          fi
          sudo ln -sfn /opt/theos/vendor/include /opt/include
          test -f /opt/theos/vendor/include/roothide.h
          test -f /opt/theos/vendor/include/rootless.h
          test -f /opt/theos/vendor/include/rootless-compat.h
          if [ ! -d /opt/theos/sdks/iPhoneOS16.5.sdk ]; then
            sudo git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
            cd /tmp/sdks && sudo git sparse-checkout set iPhoneOS16.5.sdk
            sudo cp -R /tmp/sdks/iPhoneOS16.5.sdk /opt/theos/sdks/
          fi
          test -d /opt/theos/sdks/iPhoneOS16.5.sdk

      - name: Export Theos path
        run: echo "THEOS=/opt/theos" >> "$GITHUB_ENV"

      - name: Verify release tag matches project version
        run: |
          PACKAGE_VERSION="$(awk -F': ' '$1 == "Version" { print $2; exit }' control)"
          PREFS_SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - WXRelayPrefs/Resources/Info.plist)"
          PREFS_BUILD_VERSION="$(plutil -extract CFBundleVersion raw -o - WXRelayPrefs/Resources/Info.plist)"
          TAG_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match control version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

          if [ "$PREFS_SHORT_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match CFBundleShortVersionString ($PREFS_SHORT_VERSION)." >&2
            exit 1
          fi

          if [ "$PREFS_BUILD_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match CFBundleVersion ($PREFS_BUILD_VERSION)." >&2
            exit 1
          fi

      - name: Probe build environment
        run: |
          command -v make
          command -v dpkg-deb
          command -v ldid
          command -v otool
          command -v rg
          test -n "$THEOS"
          test -d "$THEOS"
          test -f "$THEOS/vendor/include/roothide.h"
          test -f "$THEOS/vendor/include/rootless.h"
          test -f "$THEOS/vendor/include/rootless-compat.h"
          xcodebuild -version

      - name: Build packages
        timeout-minutes: 25
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 12
          command: |
            BREW_BASH="$(brew --prefix)/bin/bash"
            "$BREW_BASH" scripts/build_packages.sh

      - name: Verify expected release assets
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          test -f "out/WxRelay_${TAG_VERSION}_rootful_arm.deb"
          test -f "out/WxRelay_${TAG_VERSION}_rootless_arm64.deb"
          test -f "out/WxRelay_${TAG_VERSION}_roothide_arm64e.deb"
          ls -l out/WxRelay_*

      - name: Generate release notes
        run: |
          mkdir -p out
          ./scripts/generate_release_notes.py \
            --current-tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --output out/release-notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" out/WxRelay_* --clobber
